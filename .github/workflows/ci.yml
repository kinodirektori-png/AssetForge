name: CI

on:
  push:
    branches: [Main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AssetForge.slnx

      - name: Build
        run: dotnet build AssetForge.slnx --no-restore --configuration Release

      - name: Test with coverage
        run: >
          dotnet test AssetForge.slnx --no-build --configuration Release
          --settings coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Coverage gate (80 % lines, Linux)
        if: runner.os == 'Linux'
        run: python3 scripts/check-coverage.py 80

      - name: Coverage gate (80 % lines, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-coverage.ps1 -Threshold 80
